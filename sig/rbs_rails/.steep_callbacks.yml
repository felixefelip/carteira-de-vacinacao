---
version: 1
callbacks:
- class: ActiveStorage::Attachment
  applies_self: ActiveStorage::Attachment & ActiveStorage::Attachment::Validated
  runs_before:
  - mirror_blob_later
  - analyze_blob_later
  - transform_variants_later
  - named_variants
- class: ActiveStorage::Blob
  applies_self: ActiveStorage::Blob & ActiveStorage::Blob::Validated
  runs_before:
  - touch_attachments
  - update_service_metadata
  - service_metadata
  - service
  - key
  - filename
  - custom_metadata
- class: Caderneta
  applies_self: Caderneta & Caderneta::Validated
  runs_before:
  - criar_caderneta_de_vacinacao
  - atualizar_caderneta_de_vacinacao
- class: Caderneta::RecomendacaoVacina
  applies_self: Caderneta::RecomendacaoVacina & Caderneta::RecomendacaoVacina::Validated
    & Caderneta::RecomendacaoVacina::ValidatedViaCaderneta
  runs_before:
  - calcular_status_vacinal
  - tomou_todas_as_doses?
  - pode_tomar_nova_dose?
  - qtde_doses_tomadas
  - tem_idade_para_tomar_a_nova_dose?
  - dose_atual_dentro_do_intervalo_de_espera?
  - dose_recomendada_atual
  - pessoa_idade
  - intervalo_para_proxima_dose_termina_em
  - ultima_dose_tomada
- class: Consulta
  applies_self: Consulta & Consulta::Validated
  runs_before:
  - marcar_agendamento_como_realizado
- class: Dose
  applies_self: Dose & Dose::Validated
  runs_before:
  - atualizar_calendario
